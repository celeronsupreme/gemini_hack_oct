[project]
name = "contracts"
version = "0.1.0"
description = "Generated Pydantic models for the seizure app contracts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["."]
